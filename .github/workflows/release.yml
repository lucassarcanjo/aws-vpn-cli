name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate the release on the same checks main gets. A tag that cannot build is a
  # tag Homebrew users would install.
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - name: Verify vendored tree is consistent
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: make build
      - name: Validate Homebrew formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew tap lucassarcanjo/tap
          tap_dir="$(brew --repository lucassarcanjo/tap)"
          scripts/render-homebrew-formula "$GITHUB_REF_NAME" "$tap_dir/Formula/awsvpn.rb"
          brew audit --formula lucassarcanjo/tap/awsvpn
          brew install --build-from-source lucassarcanjo/tap/awsvpn
          brew test lucassarcanjo/tap/awsvpn
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to create."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi

  # Publish the formula to the tap that serves
  # `brew install lucassarcanjo/tap/awsvpn`. Formula/awsvpn.rb here is the
  # source of truth; only url and sha256 are rewritten on the way out, so the
  # build recipe cannot drift between the two repos.
  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_REPO: lucassarcanjo/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPO }}
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      # GitHub generates this tarball on demand. It has been stable in practice,
      # but if a digest ever shifts under an existing tag, `brew install` fails
      # closed on the mismatch rather than installing something unexpected.
      - name: Pin formula to the tagged tarball
        run: scripts/render-homebrew-formula "$GITHUB_REF_NAME" tap/Formula/awsvpn.rb

      - name: Push to tap
        working-directory: tap
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- Formula/awsvpn.rb)" ]]; then
            echo "Tap formula already matches $GITHUB_REF_NAME; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/awsvpn.rb
          git commit -m "awsvpn ${GITHUB_REF_NAME}"
          git push
