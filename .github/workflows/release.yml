name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate the release on the same checks main gets. A tag that cannot build is a
  # tag Homebrew users would install.
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          check-latest: true
      - name: Verify vendored tree is consistent
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: make build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes

  # Publish the formula to the tap that serves
  # `brew install lucassarcanjo/tap/awsvpn`. Formula/awsvpn.rb here is the
  # source of truth; only url and sha256 are rewritten on the way out, so the
  # build recipe cannot drift between the two repos.
  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_REPO: lucassarcanjo/homebrew-tap
    steps:
      - uses: actions/checkout@v7

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPO }}
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      # GitHub generates this tarball on demand. It has been stable in practice,
      # but if a digest ever shifts under an existing tag, `brew install` fails
      # closed on the mismatch rather than installing something unexpected.
      - name: Pin formula to the tagged tarball
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          tarball="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${tag}.tar.gz"
          sha="$(curl -fsSL --retry 3 "$tarball" | sha256sum | cut -d' ' -f1)"
          echo "$tag -> $sha"

          install -d tap/Formula
          sed -E \
            -e "s#refs/tags/[^\"]+\.tar\.gz#refs/tags/${tag}.tar.gz#" \
            -e "s#^  sha256 \"[0-9a-f]{64}\"#  sha256 \"${sha}\"#" \
            Formula/awsvpn.rb > tap/Formula/awsvpn.rb

          # Fail loudly rather than push a formula still holding the placeholder.
          grep -q "refs/tags/${tag}.tar.gz" tap/Formula/awsvpn.rb
          grep -q "sha256 \"${sha}\"" tap/Formula/awsvpn.rb

      - name: Push to tap
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/awsvpn.rb; then
            echo "Tap formula already matches $GITHUB_REF_NAME; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/awsvpn.rb
          git commit -m "awsvpn ${GITHUB_REF_NAME}"
          git push
